<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิกระบบออโต้</title>
    <!-- นำเข้า LINE SDK เพื่อดึงข้อมูลโปรไฟล์ -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: linear-gradient(145deg, #111827, #1f2937); border-radius: 20px; width: 100%; max-width: 450px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #10b981; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: #10b981; font-size: 24px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header p { color: #9ca3af; font-size: 14px; }
        .profile-box { background-color: #1f2937; border-radius: 15px; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border: 1px solid #374151; }
        .profile-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #10b981; background-color: #374151; object-fit: cover; }
        .profile-info h4 { color: #ffffff; font-size: 16px; margin-bottom: 3px; }
        .profile-info p { color: #6b7280; font-size: 12px; word-break: break-all; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #9ca3af; font-size: 14px; margin-bottom: 8px; }
        .form-group label span { color: #ef4444; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; background-color: #111827; border: 1px solid #374151; border-radius: 10px; color: #ffffff; font-size: 16px; transition: all 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: #10b981; outline: none; box-shadow: 0 0 8px rgba(16,185,129,0.3); }
        
        /* สไตล์เพิ่มเติมสำหรับช่องโค้ดยืนยัน */
        .code-input-wrapper { display: flex; gap: 10px; }
        .code-input-wrapper input { background-color: #1f2937; color: #f59e0b; font-weight: bold; letter-spacing: 1px; text-align: center; border: 1px dashed #f59e0b; cursor: not-allowed; }
        .btn-copy { padding: 0 15px; background-color: #374151; border: 1px solid #4b5563; border-radius: 10px; color: #ffffff; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        .btn-copy:hover { background-color: #4b5563; }
        .notice-text { color: #f59e0b; font-size: 12px; margin-top: 6px; line-height: 1.4; display: block; }
        
        .btn-submit { width: 100%; padding: 14px; background-color: #10b981; border: none; border-radius: 10px; color: #ffffff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #059669; }
        .loading { text-align: center; color: #10b981; font-size: 16px; padding: 20px; }
    </style>
</head>
<body>

<div class="card" id="main-card" style="display: none;">
    <div class="header">
        <h2>🎰 สมัครสมาชิก</h2>
        <p>กรอกข้อมูลเพื่อรับระบบฝาก-ถอนออโต้</p>
    </div>

    <!-- ส่วนแสดงข้อมูลโปรไฟล์ LINE ที่ดึงมาออโต้ -->
    <div class="profile-box">
        <img src="" alt="Profile" class="profile-img" id="user-avatar">
        <div class="profile-info">
            <h4 id="user-name">กำลังโหลดชื่อ...</h4>
            <p id="user-id">Line ID: Loading...</p>
        </div>
    </div>

    <!-- ฟอร์มกรอกข้อมูล -->
    <form id="register-form">
        <div class="form-group">
            <label>ชื่อ - นามสกุล (ตรงกับบัญชีธนาคาร) <span>*</span></label>
            <input type="text" id="fullname" placeholder="นาย ร่ำรวย เงินทอง" required>
        </div>

        <div class="form-group">
            <label>เลือกธนาคาร <span>*</span></label>
            <select id="bank" required>
                <option value="" disabled selected>-- เลือกธนาคาร --</option>
                <option value="KBANK">กสิกรไทย (KBANK)</option>
                <option value="SCB">ไทยพาณิชย์ (SCB)</option>
                <option value="KTB">กรุงไทย (KTB)</option>
                <option value="BBL">กรุงเทพ (BBL)</option>
                <option value="BAY">กรุงศรี (BAY)</option>
                <option value="TTB">ทหารไทยธนชาต (TTB)</option>
                <option value="GSB">ออมสิน (GSB)</option>
            </select>
        </div>

        <div class="form-group">
            <label>เลขบัญชีธนาคาร <span>*</span></label>
            <input type="number" id="bank-account" placeholder="กรอกเฉพาะตัวเลข" required>
        </div>

        <!-- 🎯 ช่องโค้ดยืนยันอัจฉริยะแบบที่น้าออกแบบ -->
        <div class="form-group">
            <label>รหัสยืนยันระบบออโต้ (ระบบสุ่มให้)</label>
            <div class="code-input-wrapper">
                <input type="text" id="verify-code" readonly>
                <button type="button" class="btn-copy" id="btn-copy-code">📋 คัดลอกรหัส</button>
            </div>
            <small class="notice-text">⚠️ **ข้อสำคัญ:** หลังจากกดลงทะเบียนสำเร็จแล้ว กรุณากดคัดลอกรหัสนี้ไปส่งในกลุ่มไลน์ของน้าทันที เพื่อเปิดใช้งานระบบออโต้ครับ</small>
        </div>

        <button type="submit" class="btn-submit">🔒 ยืนยันการลงทะเบียน</button>
    </form>
</div>

<div id="loading-screen" class="loading">
    ⏳ กำลังเชื่อมต่อระบบ LINE...
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // คีย์ข้อมูลของน้าเหมือนเดิม
    const firebaseConfig = {
      apiKey: "AIzaSyDgU2HELywrmi97-fAr38p5br4VLXIDq6I",
      authDomain: "my-pokdeng-bot.firebaseapp.com",
      databaseURL: "https://my-pokdeng-bot-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "my-pokdeng-bot",
      storageBucket: "my-pokdeng-bot.firebasestorage.app",
      messagingSenderId: "785545071590",
      appId: "1:785545071590:web:d787384d4a25856c332427"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const liffId = "2010761995-NNRUGId3"; 
    let generatedCode = ""; 

    // ฟังก์ชันสุ่มตัวเลข 6 หลักตามแผนใหม่
    function generateRandomCode() {
        const randNum = Math.floor(100000 + Math.random() * 900000); // สุ่มเลข 6 หลัก (100000 - 999999)
        return `c/${randNum}`;
    }

    async function initLIFF() {
        try {
            await liff.init({ liffId: liffId });
            if (!liff.isLoggedIn()) {
                liff.login(); 
            } else {
                const profile = await liff.getProfile();
                const webUserId = profile.userId; 

                // 🛡️ เช็กฝั่งหน้าเว็บประทับตราล็อกไอดี (ถ้าบัญชี LINE นี้ผูกถาวรไปแล้ว ไม่ให้สมัครซ้ำ)
                const mappingRef = ref(db, 'liff_mapping/' + webUserId);
                const mappingSnapshot = await get(mappingRef);
                
                if (mappingSnapshot.exists()) {
                    document.getElementById('loading-screen').innerHTML = "⚠️ <span style='color:#f59e0b'>คุณเคยผูกบัญชีออโต้แล้ว!</span><br>บัญชี LINE นี้ทำรายการผูกระบบไปเรียบร้อยแล้วครับ";
                    alert("⚠️ บัญชี LINE นี้เคยทำการผูกระบบออโต้ไปแล้วครับ!");
                    liff.closeWindow();
                    return;
                }

                // สุ่มโค้ดสะพานเชื่อมรอไว้ทันทีตอนเปิดหน้าเว็บ
                generatedCode = generateRandomCode();
                document.getElementById('verify-code').value = generatedCode;

                // ใส่ข้อมูลโปรไฟล์ลงหน้าจอ
                document.getElementById('user-avatar').src = profile.pictureUrl || 'https://via.placeholder.com/150';
                document.getElementById('user-name').innerText = profile.displayName;
                document.getElementById('user-id').innerText = `Line ID: ${profile.userId}`;
                
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-card').style.display = 'block';
            }
        } catch (error) {
            console.error("LIFF Initialization failed", error);
            document.getElementById('loading-screen').innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อระบบ LINE";
        }
    }

    // ระบบคลิกคัดลอกรหัสลงคลิปบอร์ด
    document.getElementById('btn-copy-code').addEventListener('click', function() {
        const codeInput = document.getElementById('verify-code');
        navigator.clipboard.writeText(codeInput.value).then(() => {
            alert("📋 คัดลอกรหัส: " + codeInput.value + " เรียบร้อยแล้วครับ! อย่าลืมเอาไปส่งในกลุ่มนะครับ");
        }).catch(err => {
            console.error('Failed to copy text: ', err);
            // กรณีเบราว์เซอร์เก่าจัดๆ ให้คัดลอกด้วยวิธีดั้งเดิม
            codeInput.select();
            document.execCommand('copy');
            alert("📋 คัดลอกรหัสเรียบร้อยแล้วครับ!");
        });
    });

    // ตอนกดยืนยันการลงทะเบียน
    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const webUserId = document.getElementById('user-id').innerText.replace('Line ID: ', '').trim();
        const fullname = document.getElementById('fullname').value.trim();
        const bank = document.getElementById('bank').value;
        const account = document.getElementById('bank-account').value.trim();

        if (!webUserId || !generatedCode) {
            alert("❌ ข้อมูลไม่ครบถ้วน กรุณาลองใหม่อีกครั้งครับ");
            return;
        }

        // แปลงรหัสสุ่มให้ไม่มีเครื่องหมาย / เพื่อป้องกันโฟลเดอร์ใน Firebase บิดเบี้ยว (เช่น จาก c/123456 เป็น c_123456)
        const dbCodePath = generatedCode.replace('/', '_');
        
        // 🎯 บันทึกเข้าถังพักชั่วคราว (pending_verify) รอให้บอท 1 มารับช่วงต่อ
        const pendingRef = ref(db, 'pending_verify/' + dbCodePath);

        try {
            // บันทึกข้อมูลที่สมาชิกกรอกลงกล่องชั่วคราว
            await set(pendingRef, {
                name: fullname,
                bankName: bank,
                bankAccount: account,
                registeredAt: new Date().toISOString()
            });

            // ปลุกแจ้งเตือนและย้ำให้น้าๆ คัดลอกโค้ดอีกครั้ง
            alert(`🎉 ลงทะเบียนสำเร็จ!\n\nกรุณานำโค้ด: ${generatedCode} ไปพิมพ์ส่งในกลุ่มไลน์ทันทีเพื่อเปิดระบบออโต้ครับน้า`);
            liff.closeWindow();

        } catch (error) {
            console.error("Firebase save error:", error);
            alert("❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้งครับน้า");
        }
    });

    window.onload = initLIFF;
</script>

</body>
</html>
